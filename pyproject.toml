[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pf-grants"
version = "0.1.0"
description = "Extract the grants list (Part XV) from IRS e-filed Form 990-PF returns into CSV. Public data, no API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["lxml>=4.9"]
keywords = ["irs", "990-PF", "nonprofit", "foundations", "grants", "fundraising", "open-data"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
slow-unzip = ["stream-unzip"]
test = ["pytest"]

[project.scripts]
pf-grants = "pfgrants.cli:main"

[tool.setuptools]
packages = ["pfgrants"]

[tool.pytest.ini_options]
testpaths = ["tests"]
